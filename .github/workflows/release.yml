# Lyrion.app 1.0b — one bundle per OS and processor family.
# Unsigned. Apple notarization and Authenticode can be added later via secrets.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            rust: stable
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            rust: stable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            rust: stable
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            rust: 1.78.0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
            squeezelite: true
            rust: 1.78.0

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Linux stays on 1.78. Current stable drops WebKitGTK trait methods out of
      # scope in wry 0.24, and 1.78 is the oldest Cargo that reads this lockfile.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: macOS bundler tools
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Build the Linux ARM64 player
        if: matrix.squeezelite
        run: |
          sudo apt-get install -y build-essential pkg-config libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev libfaad-dev libmad0-dev
          git clone --depth 1 https://github.com/ralph-irving/squeezelite.git "$RUNNER_TEMP/squeezelite"
          make -C "$RUNNER_TEMP/squeezelite" -j"$(nproc)"
          install -m 755 "$RUNNER_TEMP/squeezelite/squeezelite" "src-tauri/binaries/squeezelite-${{ matrix.target }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lyrion 1.0b"
          releaseBody: |
            Lyrion.app 1.0b, unsigned builds.

            - macOS Apple Silicon and macOS Intel (10.13 or later, including Catalina)
            - Windows 10 and 11, 64-bit Intel or AMD
            - Linux x86-64 (.deb and AppImage) and Linux ARM64 (.deb)

            Windows on ARM is not in this release. The bundled player is Squeezelite (GPLv3).
            On macOS, if Gatekeeper blocks the app: xattr -cr /Applications/Lyrion.app
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
