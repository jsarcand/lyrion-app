# Lyrion.app 1.0b — one bundle per OS and processor family.
# Unsigned. Apple notarization and Authenticode can be added later via secrets.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            rust: stable
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            rust: stable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            rust: stable
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            rust: stable
            omit_player: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            rust: stable
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
            squeezelite: true
            rust: stable

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # wry 0.24.12 imports SettingsExt. Rust 1.93 and later reject wry 0.24.11.
      # Stay on current stable. Do not add a repo rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: macOS bundler tools
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Build the Linux ARM64 player
        if: matrix.squeezelite
        run: |
          sudo apt-get install -y build-essential pkg-config libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev libfaad-dev libmad0-dev
          git clone --depth 1 https://github.com/ralph-irving/squeezelite.git "$RUNNER_TEMP/squeezelite"
          make -C "$RUNNER_TEMP/squeezelite" -j"$(nproc)"
          install -m 755 "$RUNNER_TEMP/squeezelite/squeezelite" "src-tauri/binaries/squeezelite-${{ matrix.target }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows on ARM has no Squeezelite sidecar. Drop the external binary so
      # the bundler does not look for one. The app still controls other players.
      - name: Leave out the bundled player
        if: matrix.omit_player
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
          cfg.tauri.bundle.externalBin = [];
          cfg.tauri.allowlist.shell.sidecar = false;
          cfg.tauri.allowlist.shell.scope = [];
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          EOF

      # The Windows ARM Tauri CLI is built without a TLS backend, so its own
      # NSIS download fails. PowerShell can fetch the same files. Tauri 1.6
      # skips the download when this cache is already complete.
      - name: Cache NSIS for the Windows ARM bundler
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.zip'
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3/nsis-3.zip' -OutFile $zip
          $zipHash = (Get-FileHash -Algorithm SHA1 $zip).Hash
          if ($zipHash -ne '057E83C7D82462EC394AF76C87D06733605543D4') { throw "unexpected NSIS zip hash $zipHash" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $unpacked = Join-Path $dest 'nsis-3.08'
          if (-not (Test-Path $unpacked)) {
            Get-ChildItem $dest | ForEach-Object { $_.FullName }
            throw 'nsis-3.zip did not contain nsis-3.08'
          }
          $nsis = Join-Path $dest 'NSIS'
          if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
          Rename-Item $unpacked 'NSIS'
          $pluginDir = Join-Path $nsis 'Plugins\x86-unicode'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          $dll = Join-Path $pluginDir 'nsis_tauri_utils.dll'
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.4.1/nsis_tauri_utils.dll' -OutFile $dll
          $dllHash = (Get-FileHash -Algorithm SHA1 $dll).Hash
          if ($dllHash -ne 'F99A50209A345185A84D34D0E5F66D04C75FF52F') { throw "unexpected NSIS plugin hash $dllHash" }

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lyrion 1.0b"
          releaseBody: |
            Lyrion.app 1.0b, unsigned builds.

            - macOS Apple Silicon and macOS Intel (10.13 or later, including Catalina)
            - Windows 10 and 11, 64-bit Intel or AMD, and 64-bit ARM
            - Linux x86-64 (.deb and AppImage) and Linux ARM64 (.deb)

            The Windows on ARM build does not include Squeezelite. Other builds bundle it (GPLv3).
            On macOS, if Gatekeeper blocks the app: xattr -cr /Applications/Lyrion.app
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
